name: Temporary Paladium V12 PR export

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Export current official V12 visual assets
        run: python3 paladium_export.py
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Paladium_V12_Textures_Complete_2026-08-19
          path: Paladium_V12_Textures_Complete_2026-08-19.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
